name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/midnight-post-office

jobs:
  # 1. Fast checks: code style, unit tests, Dockerfile best practices.
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r src/requirements.txt
          pip install flake8 pytest

      - name: Lint Python
        run: flake8 src/ --max-line-length=100 --extend-exclude=__pycache__

      - name: Unit tests
        run: pytest tests/ -v

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  # 2. Build the real stack and prove it works: integration test + vulnerability scan.
  build-and-verify:
    name: Build & integration test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Create dev env + secret for CI
        run: |
          cat > .env <<EOF
          POSTGRES_USER=postgres
          POSTGRES_DB=postoffice
          DB_HOST=db
          REDIS_HOST=queue
          APP_VERSION=${{ github.sha }}
          DELIVERY_DELAY=2
          EOF
          mkdir -p secrets
          echo "ci-test-password" > secrets/db_password.txt

      - name: Build & start the stack
        run: docker compose up -d --build

      - name: Wait for services to settle
        run: sleep 5

      - name: Run self-check (check.sh)
        run: ./check.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Vulnerability scan
        if: always()
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: midnight-post-office:latest
          severity: CRITICAL,HIGH
          exit-code: "0" # report only for now — flip to "1" to block merges on CVEs

      - name: Tear down
        if: always()
        run: docker compose down -v

  # 3. Only on a real merge to main: publish the image, tagged with the commit SHA.
  publish:
    name: Push image to GHCR
    runs-on: ubuntu-latest
    needs: build-and-verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            APP_VERSION=${{ github.sha }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
